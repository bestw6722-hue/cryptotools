<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Converter | CryptoTools</title><meta name="description" content="Convert a crypto amount using an assumed USD price."><link rel="stylesheet" href="/styles.css"></head><body><header><div class="container nav"><a class="brand" href="/">Crypto<span>Tools</span></a><nav><a href="/">Home</a><a href="/#tools">Tools</a><a href="/#learn">Learn</a></nav></div></header><main class="section"><div class="container calculator tool-page"><a class="back" href="/#tools">← All tools</a><p class="eyebrow">FREE CALCULATOR</p><h1>Crypto Converter</h1><p class="lead">Convert a crypto amount using an assumed USD price.</p><div class="form-grid"><label>Crypto amount<input id="amount" type="number" value="0.1" min="0" step="0.00000001"></label><label>Price per coin ($)<input id="price" type="number" value="60000" min="0"></label></div><div class="result"><span>Estimated USD value</span><strong id="usd">$0</strong></div><div class="notice">For education only. Crypto prices are volatile. This calculator does not provide investment advice.</div></div></main><footer><div class="container footer"><a class="brand" href="/">Crypto<span>Tools</span></a><a href="/disclosure.html">Disclosure</a></div></footer><script>function calc(){usd.textContent='$'+((+amount.value||0)*(+price.value||0)).toLocaleString(undefined,{maximumFractionDigits:2})}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
